<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Peron Tips Limited</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="title">Admin Login - Peron Tips Limited</h1>
    <p>Please login to access the admin panel</p>

    <form id="admin-login-form">
        <label for="admin-email">Email:</label>
        <input type="email" id="admin-email" required><br>

        <label for="admin-password">Password:</label>
        <input type="password" id="admin-password" required><br>

        <button type="submit" class="button">Login</button>
    </form>

    <script>
        document.getElementById('admin-login-form').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent the form from submitting
            const adminEmail = document.getElementById('admin-email').value;
            const adminPassword = document.getElementById('admin-password').value;

            // Example credentials for admin login
            const validAdminEmail = "perontips@gmail.com";
            const validAdminPassword = "peron1945";

            // Validate admin credentials
            if (adminEmail === validAdminEmail && adminPassword === validAdminPassword) {
                alert('Admin login successful!');
                window.location.href = 'admin_dashboard.html'; // Redirect to admin dashboard
            } else {
                alert('Invalid email or password');
            }
        });
    </script>
</body>
</html>
