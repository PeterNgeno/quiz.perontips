<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link rel="stylesheet" href="style.css"> <!-- Link to the CSS file -->
</head>
<body>
  <div class="login-container">
    <h1>Admin Login</h1>
    <form id="adminLoginForm">
      <div class="form-group">
        <label for="adminName">Name:</label>
        <input type="text" id="adminName" name="name" placeholder="Enter your name" required>
      </div>
      <div class="form-group">
        <label for="adminEmail">Email:</label>
        <input type="email" id="adminEmail" name="email" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label for="adminPassword">Password:</label>
        <input type="password" id="adminPassword" name="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="button">Login</button>
    </form>
    <p id="errorMessage" class="error-message" style="color: red;"></p>
  </div>

  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', async (event) => {
      event.preventDefault();

      // Collect form data
      const name = document.getElementById('adminName').value.trim();
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value.trim();

      try {
        // Send login request to server
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ name, email, password }),
        });

        const data = await response.json();

        if (response.ok) {
          // Redirect to admin panel if login is successful
          window.location.href = 'admin_dashboard.html'; // Update with your admin panel file
        } else {
          // Display error message
          document.getElementById('errorMessage').textContent = data.error || 'Invalid credentials';
        }
      } catch (error) {
        console.error('Error during admin login:', error);
        document.getElementById('errorMessage').textContent = 'An error occurred. Please try again later.';
      }
    });
  </script>
</body>
</html>
